<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F2studio — Foto &amp; videografie</title>
<meta name="robots" content="noindex">
<!-- Wie hier belandt zonder taal in de link, gaat door naar het Nederlands.
     Staat de browser op Arabisch, dan sturen we door naar de Arabische versie. -->
<link rel="canonical" href="/nl/">
<meta http-equiv="refresh" content="0; url=/nl/">
<script>
  (function () {
    var taal = (navigator.language || "nl").toLowerCase();
    window.location.replace(taal.indexOf("ar") === 0 ? "/ar/" : "/nl/");
  })();
</script>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #faf7f2;
    color: #2a2622;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 18px;
  }
  a { color: #8b7355; }
</style>
</head>
<body>
  <p>
    Ga verder naar <a href="/nl/">Nederlands</a> &middot;
    <a href="/ar/">العربية</a>
  </p>
</body>
</html>
